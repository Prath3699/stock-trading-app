<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CryptoTrade — Live Trading Terminal</title>
        <meta name="description" content="Paper-trading terminal with live CoinGecko prices: market screener, candlestick charts, limit orders, portfolio P&L and watchlist.">
        <meta property="og:title" content="CryptoTrade — Live Trading Terminal">
        <meta property="og:description" content="Real-time BTC/ETH/SOL/DOGE trading simulator powered by CoinGecko.">
        <meta property="og:type" content="website">
        <meta name="theme-color" content="#2b2e31">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
        <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
        <link href="css/font-awesome.min.css" rel="stylesheet" type="text/css"/>
        <link href="css/custom.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>

        <div id="ta_app" class="container-fluid">

            <!-- Start Section Header -->
            <section id="ta_header" class="row">

                <div class="col-12 d-flex justify-content-between align-items-center">
                    <div>
                        <div class="name">
                            <span id="balance_symbol">BTC/USD</span> Price
                        </div>
                        <div class="caption">
                            <span id="balance_price" class="price-big">$42,000</span>
                            <i id="balance_arrow" class="fa fa-caret-up up mr-1 ml-2"></i>
                            <span id="balance_change" class="up">+7.62% (+$900)</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center header_right">
                        <div class="equity_box text-right mr-3 d-none d-sm-block">
                            <div class="name">Equity</div>
                            <div class="equity_value" id="header_equity">$10,000.00</div>
                        </div>
                        <button id="search_btn" class="btn theme-toggle-btn" aria-label="Search markets" title="Search markets">
                            <i class="fa fa-search"></i>
                        </button>
                        <button id="theme_toggle" class="btn theme-toggle-btn ml-2" aria-label="Toggle dark mode" title="Toggle dark / light mode">
                            <i class="fa fa-moon-o"></i>
                        </button>
                    </div>
                </div>

            </section>
            <!-- End Section Header -->

            <!-- Start Section Asset Switcher -->
            <section id="ta_assets" class="row">
                <div class="col-12 px-0 d-flex asset-bar" role="tablist" aria-label="Select asset">
                    <button type="button" class="btn asset_btn active" data-asset="BTC" role="tab" aria-selected="true"><i class="fa fa-bitcoin"></i> BTC</button>
                    <button type="button" class="btn asset_btn" data-asset="ETH" role="tab" aria-selected="false"><i class="fa fa-ethereum"></i> ETH</button>
                    <button type="button" class="btn asset_btn" data-asset="SOL" role="tab" aria-selected="false"><i class="fa fa-bolt"></i> SOL</button>
                    <button type="button" class="btn asset_btn" data-asset="DOGE" role="tab" aria-selected="false"><i class="fa fa-coins"></i> DOGE</button>
                    <span id="data_source_badge" class="badge badge-demo" aria-live="polite"><i class="fa fa-flask"></i> DEMO</span>
                </div>
            </section>
            <!-- End Section Asset Switcher -->

            <!-- Start Tabs -->
            <nav id="ta_tabs" class="row" aria-label="App sections">
                <div class="col-12 px-0 tabs_bar">
                    <button class="tab_btn active" data-tab="chart"><i class="fa fa-line-chart"></i> Chart</button>
                    <button class="tab_btn" data-tab="market"><i class="fa fa-th-list"></i> Market</button>
                    <button class="tab_btn" data-tab="orders"><i class="fa fa-list-alt"></i> Orders <span id="orders_count" class="pill-count">0</span></button>
                    <button class="tab_btn" data-tab="portfolio"><i class="fa fa-briefcase"></i> Portfolio</button>
                </div>
            </nav>
            <!-- End Tabs -->

            <!-- Start Tab: Chart + Trade -->
            <div class="tab-pane active" id="tab_chart">
              <div class="chart_layout">
                <div class="chart_col">

                <section id="ta_body_chart" class="row">
                    <div class="col-12 d-flex justify-content-between align-items-center chart_head_row px-0">
                        <div class="chart_title" id="chart_title">Bitcoin · BTC/USD</div>
                        <div class="chart_timeframes btn-group" role="group" aria-label="Chart timeframe">
                            <button type="button" class="btn tf_btn" data-days="30">1M</button>
                            <button type="button" class="btn tf_btn" data-days="90">3M</button>
                            <button type="button" class="btn tf_btn" data-days="180">6M</button>
                            <button type="button" class="btn tf_btn active" data-days="365">1Y</button>
                        </div>
                    </div>
                    <div id="chartContainer" style="height: 300px;" class="col-12 pl-0 text-center"></div>
                </section>

                <!-- Start Section Transactions -->
                <section id="ta_body_transactions" class="row">
                    <div class="col-12 text-center">
                        <div class="body_title text-left">
                            Recent transaction
                            <span class="view_all" id="tx_view_all">View all</span>
                        </div>
                        <div class="transactions_list" id="transactions_list"></div>
                    </div>
                </section>
                <!-- End Section Transactions -->

                </div><!-- /chart_col -->

                <div class="ticket_col">

                <!-- Start Section Order Ticket -->
                <section id="ta_order_ticket" class="row">
                    <div class="col-12 px-0">
                        <div class="order_card">
                        <div class="order_card_head">
                            <span class="order_card_sym" id="ticket_symbol">BTC/USD</span>
                            <span class="order_card_price" id="ticket_price">$42,000</span>
                        </div>
                        <div class="order_type_bar" role="group" aria-label="Order type">
                            <button class="btn ot_btn active" data-otype="market">Market</button>
                            <button class="btn ot_btn" data-otype="limit">Limit</button>
                        </div>

                        <div class="ticket_grid">
                            <label class="ticket_field">
                                <span class="field_label">Quantity</span>
                                <input type="number" id="ord_qty" min="0" step="any" placeholder="0.00" inputmode="decimal">
                            </label>
                            <label class="ticket_field" id="ord_limit_wrap" hidden>
                                <span class="field_label">Limit price (USD)</span>
                                <input type="number" id="ord_limit" min="0" step="any" placeholder="0.00" inputmode="decimal">
                            </label>
                        </div>

                        <div class="qty_pct_row" id="qty_pct_row">
                            <button class="btn pct_btn" data-pct="25">25%</button>
                            <button class="btn pct_btn" data-pct="50">50%</button>
                            <button class="btn pct_btn" data-pct="75">75%</button>
                            <button class="btn pct_btn" data-pct="100">Max</button>
                        </div>

                        <div class="ticket_summary" id="ticket_summary">Est. cost — $0.00 &nbsp;·&nbsp; Cash — $10,000.00</div>

                        <div class="d-flex action_btns_row">
                            <button class="btn ta_btn_buy flex-fill mr-2" id="btn_buy">
                                <i class="fa fa-long-arrow-down"></i> BUY
                            </button>
                            <button class="btn ta_btn_sell flex-fill ml-2" id="btn_sell">
                                <i class="fa fa-long-arrow-up"></i> SELL
                            </button>
                        </div>
                        </div>
                    </div>
                </section>
                <!-- End Section Order Ticket -->

                </div><!-- /ticket_col -->
              </div><!-- /chart_layout -->
            </div>
            <!-- End Tab: Chart -->

            <!-- Start Tab: Market -->
            <div class="tab-pane" id="tab_market">
                <section class="row">
                    <div class="col-12 px-0">
                        <div class="body_title text-left">Markets</div>
                        <div class="mkt_search_wrap">
                            <i class="fa fa-search"></i>
                            <input type="text" id="mkt_search" placeholder="Search coin…" autocomplete="off">
                        </div>
                        <table class="table mkt_table" id="mkt_table">
                            <thead>
                                <tr>
                                    <th class="sortable" data-sort="rank">#</th>
                                    <th>Name</th>
                                    <th class="sortable num" data-sort="price">Price</th>
                                    <th class="sortable num" data-sort="chg">24h %</th>
                                    <th class="num">★</th>
                                </tr>
                            </thead>
                            <tbody id="mkt_tbody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
            <!-- End Tab: Market -->

            <!-- Start Tab: Orders -->
            <div class="tab-pane" id="tab_orders">
                <section class="row">
                    <div class="col-12 px-0">
                        <div class="body_title text-left">Open orders</div>
                        <div class="orders_list" id="orders_list"></div>
                        <div class="body_title text-left mt-4">History</div>
                        <div class="orders_list" id="history_list"></div>
                    </div>
                </section>
            </div>
            <!-- End Tab: Orders -->

            <!-- Start Tab: Portfolio -->
            <div class="tab-pane" id="tab_portfolio">
                <section class="row">
                    <div class="col-12 px-0">
                        <div class="pf_summary">
                            <div class="pf_card">
                                <div class="name">Total equity</div>
                                <div class="pf_value" id="pf_equity">$10,000.00</div>
                            </div>
                            <div class="pf_card">
                                <div class="name">Cash</div>
                                <div class="pf_value" id="pf_cash">$10,000.00</div>
                            </div>
                            <div class="pf_card">
                                <div class="name">Unrealized P&amp;L</div>
                                <div class="pf_value" id="pf_pnl">$0.00</div>
                            </div>
                        </div>
                        <div class="body_title text-left mt-4">Holdings</div>
                        <div class="holdings_list" id="holdings_list"></div>
                        <div class="col-12 px-0 mt-4">
                            <button class="btn reset_btn w-100" id="btn_reset"><i class="fa fa-refresh"></i> Reset demo account</button>
                        </div>
                    </div>
                </section>
            </div>
            <!-- End Tab: Portfolio -->

        </div>

        <!-- Search overlay -->
        <div id="search_overlay" hidden>
            <div class="search_panel">
                <div class="mkt_search_wrap">
                    <i class="fa fa-search"></i>
                    <input type="text" id="global_search" placeholder="Search any coin on CoinGecko…" autocomplete="off">
                    <button class="search_close" id="search_close" aria-label="Close search"><i class="fa fa-times"></i></button>
                </div>
                <div id="search_results" class="search_results"></div>
            </div>
        </div>

        <!-- Toast notification -->
        <div id="ta_toast" role="status" aria-live="polite"></div>

        <script src="js/jquery.min.js" type="text/javascript"></script>
        <script src="js/canvasjs.min.js" type="text/javascript"></script>
        <script src="js/api.js" type="text/javascript"></script>
        <script src="js/store.js" type="text/javascript"></script>
        <script src="js/data-chart.js" type="text/javascript"></script>
        <script src="js/trading.js" type="text/javascript"></script>
        <script src="js/market.js" type="text/javascript"></script>
        <script src="js/custom.js" type="text/javascript"></script>
    </body>
</html>
